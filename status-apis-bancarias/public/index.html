<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Status da API</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #1c2230;
    --muted: #6b7385;
    --border: #e2e5eb;
    --ok: #1f9d55;
    --ok-bg: #e6f6ec;
    --warn: #b7791f;
    --warn-bg: #fdf3e1;
    --down: #d64545;
    --down-bg: #fdeaea;
    --idle: #8a92a3;
    --idle-bg: #eef0f3;
    --accent: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11141b;
      --card: #1a1f29;
      --text: #e7eaf0;
      --muted: #9aa3b5;
      --border: #2a3140;
      --ok-bg: #12301f;
      --warn-bg: #33270f;
      --down-bg: #3a1717;
      --idle-bg: #232937;
      --accent: #5b8cff;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 860px; margin: 0 auto; padding: 32px 16px 48px; }
  header { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  h1 { font-size: 22px; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 8px;
    padding: 8px 14px; font: inherit; font-size: 14px; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: default; }

  .banner {
    display: flex; align-items: center; gap: 12px;
    border-radius: 12px; padding: 16px 18px; margin-bottom: 20px;
    font-weight: 600; border: 1px solid var(--border);
  }
  .banner.ok   { background: var(--ok-bg);   color: var(--ok); }
  .banner.warn { background: var(--warn-bg); color: var(--warn); }
  .banner.down { background: var(--down-bg); color: var(--down); }
  .banner.idle { background: var(--idle-bg); color: var(--idle); }

  .dot { width: 12px; height: 12px; border-radius: 50%; background: currentColor; flex: none; }
  .banner.down .dot, .pill.down .dot { animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }

  .grid { display: grid; gap: 12px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 18px;
  }
  .card-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .name { font-weight: 600; font-size: 16px; }
  .url { color: var(--muted); font-size: 12px; word-break: break-all; margin-top: 2px; }
  .pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 600;
  }
  .pill .dot { width: 8px; height: 8px; }
  .pill.ok   { background: var(--ok-bg);   color: var(--ok); }
  .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .pill.down { background: var(--down-bg); color: var(--down); }
  .pill.idle { background: var(--idle-bg); color: var(--idle); }

  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-top: 14px; }
  .metric .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .metric .value { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .mods { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
  .mods .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
  .mods ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .mods li { display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .metric .value.small { font-size: 15px; line-height: 1.35; }
  .url a, .incidente a { color: var(--accent); text-decoration: none; }
  .url a:hover, .incidente a:hover { text-decoration: underline; }
  .mods li.incidente { align-items: flex-start; }
  .mods li.incidente .pill { flex: none; margin-top: 1px; }
  .note { margin-top: 12px; font-size: 13px; color: var(--muted); }
  .note.err { color: var(--down); }
  footer { margin-top: 24px; color: var(--muted); font-size: 12px; text-align: center; }

  .acoes { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .usuario { color: var(--muted); font-size: 13px; }
  button.ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }

  .gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .gate-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 32px 28px; width: 100%; max-width: 380px; text-align: center;
  }
  .gate-title { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .gate-card button { width: 100%; margin-top: 20px; padding: 11px 14px; }
</style>
<!-- SDK do Firebase servido pelo próprio Firebase Hosting (configuração automática do projeto) -->
<script src="/__/firebase/10.12.2/firebase-app-compat.js"></script>
<script src="/__/firebase/10.12.2/firebase-auth-compat.js"></script>
<script src="/__/firebase/init.js"></script>
</head>
<body>
<section class="gate" id="gate">
  <div class="gate-card">
    <div class="gate-title" id="gateTitulo">Status da API</div>
    <div class="sub">Acesso restrito à equipe interna.</div>
    <button id="entrar">Entrar com Google</button>
    <div class="note err" id="gateErro"></div>
  </div>
</section>

<main id="app" hidden>
  <header>
    <div>
      <h1 id="titulo">Status da API</h1>
      <div class="sub" id="sub">Verificando…</div>
    </div>
    <div class="acoes">
      <span class="usuario" id="usuario"></span>
      <button class="ghost" id="sair">Sair</button>
      <button id="btn">Verificar agora</button>
    </div>
  </header>

  <div class="banner idle" id="banner"><span class="dot"></span><span id="bannerText">Verificando serviços…</span></div>

  <div class="grid" id="grid"></div>

  <footer id="footer"></footer>
</main>

<script>
/* ============ CONFIGURAÇÃO ============
   Edite só este bloco. Para monitorar mais de um endpoint,
   basta adicionar outro item em "servicos". */
const CONFIG = {
  titulo: "Status APIs Bancárias",
  intervaloSegundos: 30,   // de quanto em quanto tempo checa
  timeoutMs: 10000,        // acima disso considera fora do ar
  latenciaLentaMs: 1500,   // acima disso marca como lento
  servicos: [
    // tipo "health": chama o endpoint /health da API diretamente
    { nome: "Sicoob · Cobrança Bancária v3", url: "https://api.sicoob.com.br/cobranca-bancaria/v3/health" },

    // tipo "statuspage": lê a página oficial de status do banco (Atlassian Statuspage)
    // filtro: mostra só componentes cujo nome ou grupo contenha um desses termos ([] = todos)
    { nome: "Efí Bank · APIs", tipo: "statuspage", url: "https://status.sejaefi.com.br", filtro: ["API"] }
  ],
  // Quem pode entrar (login Google). Libera por domínio do e-mail e/ou e-mails avulsos.
  acesso: {
    dominios: ["ixcsoft.com.br"],
    emails: []                          // ex.: ["fulano@gmail.com"]
  }
};
/* ===================================== */

const ESTADOS = {
  ok:      { classe: "ok",   texto: "Operacional" },
  lento:   { classe: "warn", texto: "Lento" },
  degradado:{ classe: "warn", texto: "Degradado" },
  manutencao:{ classe: "warn", texto: "Manutenção" },
  fora:    { classe: "down", texto: "Fora do ar" },
  semdados:{ classe: "idle", texto: "Sem dados" },
  checando:{ classe: "idle", texto: "Verificando" }
};

// Status dos componentes do Atlassian Statuspage
const STATUSPAGE = {
  operational:          { estado: "ok",         texto: "Operacional" },
  degraded_performance: { estado: "degradado",  texto: "Lento" },
  partial_outage:       { estado: "degradado",  texto: "Falha parcial" },
  major_outage:         { estado: "fora",       texto: "Fora do ar" },
  under_maintenance:    { estado: "manutencao", texto: "Manutenção" }
};
const IMPACTO = { none: "Sem impacto", minor: "Impacto baixo", major: "Impacto alto", critical: "Crítico", maintenance: "Manutenção" };
const COR_IMPACTO = { none: "idle", minor: "warn", major: "down", critical: "down", maintenance: "warn" };
const DESCRICAO = {
  "all systems operational": "Todos operacionais",
  "partially degraded service": "Parcialmente degradado",
  "minor service outage": "Falha menor",
  "partial system outage": "Falha parcial",
  "major service outage": "Falha grave",
  "major system outage": "Falha grave",
  "service under maintenance": "Em manutenção"
};

const estado = CONFIG.servicos.map(s => ({
  ...s,
  modo: "cors",          // muda para "no-cors" se a API bloquear CORS
  resultado: { estado: "checando" },
  desde: null
}));

let proxima = 0;
let rodando = false;

document.title = CONFIG.titulo;
document.getElementById("titulo").textContent = CONFIG.titulo;
document.getElementById("gateTitulo").textContent = CONFIG.titulo;

// Entende os formatos mais comuns de health check
// (ASP.NET Core "Healthy", Spring Actuator {"status":"UP"}, RFC health+json "pass"...)
function classificar(valor) {
  const v = String(valor ?? "").toLowerCase();
  if (["up", "healthy", "ok", "pass", "true"].includes(v)) return "ok";
  if (["degraded", "warn", "warning"].includes(v))         return "degradado";
  if (["down", "unhealthy", "fail", "error", "false", "out_of_service"].includes(v)) return "fora";
  return null;
}

function interpretarCorpo(txt) {
  if (!txt) return null;
  let valor = txt.trim();
  const componentes = [];
  try {
    const json = JSON.parse(valor);
    valor = json.status ?? json.Status ?? json.state ?? json.health ?? "";
    // Módulos internos, ex.: Sicoob {"RestHealthCheck": {"name","description","status"}}
    for (const [chave, item] of Object.entries(json)) {
      if (item && typeof item === "object" && "status" in item) {
        componentes.push({ nome: item.description || item.name || chave, status: String(item.status) });
      }
    }
  } catch { /* texto puro */ }
  const saude = classificar(valor);
  if (!saude) return null;
  // Se o geral está UP mas algum módulo não, considera degradado
  const algumRuim = componentes.some(c => classificar(c.status) !== "ok");
  return { saude: saude === "ok" && algumRuim ? "degradado" : saude, texto: String(valor), componentes };
}

async function requisitar(url, modo) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), CONFIG.timeoutMs);
  const inicio = performance.now();
  try {
    const resp = await fetch(url, { mode: modo, cache: "no-store", signal: ctrl.signal });
    const corpo = modo === "cors" ? await resp.text().catch(() => "") : "";
    return { resp, corpo, latencia: Math.round(performance.now() - inicio) };
  } finally {
    clearTimeout(timer);
  }
}

// Lê /api/v2/summary.json de uma página Atlassian Statuspage
async function checarStatuspage(s) {
  try {
    const base = s.url.replace(/\/+$/, "");
    const { resp, corpo, latencia } = await requisitar(base + "/api/v2/summary.json", "cors");
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const json = JSON.parse(corpo);

    const todos = json.components || [];
    const grupos = Object.fromEntries(todos.filter(c => c.group).map(c => [c.id, c.name]));
    let itens = todos
      .filter(c => !c.group)
      .sort((a, b) => (a.position ?? 0) - (b.position ?? 0))
      .map(c => ({ nome: c.name, grupo: grupos[c.group_id] || "", status: c.status }));

    const termos = (s.filtro || []).map(t => t.toLowerCase());
    let aviso;
    if (termos.length) {
      const filtrados = itens.filter(c => termos.some(t => c.nome.toLowerCase().includes(t) || c.grupo.toLowerCase().includes(t)));
      if (filtrados.length) itens = filtrados;
      else aviso = `Nenhum componente corresponde ao filtro (${s.filtro.join(", ")}); mostrando todos.`;
    }

    const estados = itens.map(c => (STATUSPAGE[c.status] || { estado: "degradado" }).estado);
    let est = "ok";
    if (estados.includes("fora")) est = "fora";
    else if (estados.includes("degradado")) est = "degradado";
    else if (estados.includes("manutencao")) est = "manutencao";

    const incidentes = (json.incidents || []).map(i => ({
      nome: i.name,
      impacto: IMPACTO[i.impact] || i.impact,
      cor: COR_IMPACTO[i.impact] || "warn",
      link: i.shortlink,
      atualizacao: i.incident_updates?.[0]?.body || ""
    }));

    return {
      estado: est,
      latencia,
      tipo: "statuspage",
      oficial: DESCRICAO[(json.status?.description || "").toLowerCase()] || json.status?.description || "—",
      okCount: estados.filter(e => e === "ok").length,
      total: itens.length,
      componentes: itens.map(c => {
        const m = STATUSPAGE[c.status] || { estado: "degradado", texto: c.status };
        return { nome: c.nome, status: m.texto, estado: m.estado };
      }),
      incidentes,
      aviso
    };
  } catch (e) {
    return {
      estado: "semdados",
      tipo: "statuspage",
      erro: e.name === "AbortError"
        ? `A página de status não respondeu em ${CONFIG.timeoutMs / 1000}s.`
        : "Não foi possível ler a página oficial de status. Isso não significa que o banco esteja fora do ar."
    };
  }
}

async function checar(s) {
  if (s.tipo === "statuspage") return checarStatuspage(s);
  const lento = ms => ms > CONFIG.latenciaLentaMs;
  try {
    if (s.modo === "cors") {
      try {
        const { resp, corpo, latencia } = await requisitar(s.url, "cors");
        const saude = interpretarCorpo(corpo);
        if (resp.status === 401 || resp.status === 403) {
          return {
            estado: lento(latencia) ? "lento" : "ok", codigo: resp.status, latencia,
            aviso: "O gateway respondeu, mas pediu autenticação: o servidor está no ar, porém o status interno do serviço não pôde ser lido."
          };
        }
        let est;
        if (!resp.ok || saude?.saude === "fora") est = "fora";
        else if (saude?.saude === "degradado") est = "degradado";
        else est = lento(latencia) ? "lento" : "ok";
        return { estado: est, codigo: resp.status, latencia, corpo: saude?.texto, componentes: saude?.componentes };
      } catch (e) {
        if (e.name === "AbortError") throw e;
        // Falhou sem resposta legível: pode ser CORS. Tenta em modo no-cors.
      }
    }
    const { latencia } = await requisitar(s.url, "no-cors");
    s.modo = "no-cors";
    return {
      estado: lento(latencia) ? "lento" : "ok",
      codigo: null,
      latencia,
      aviso: "A API respondeu, mas bloqueia CORS: o código HTTP e o corpo não ficam visíveis no navegador."
    };
  } catch (e) {
    return {
      estado: "fora",
      latencia: null,
      erro: e.name === "AbortError"
        ? `Sem resposta em ${CONFIG.timeoutMs / 1000}s (timeout).`
        : "Não foi possível conectar (rede, DNS ou certificado)."
    };
  }
}

async function checarTodos() {
  if (rodando) return;
  rodando = true;
  btn.disabled = true;
  const resultados = await Promise.all(estado.map(checar));
  const agora = new Date();
  resultados.forEach((r, i) => {
    const s = estado[i];
    if (s.resultado.estado !== r.estado) s.desde = agora;
    s.resultado = { ...r, quando: agora };
  });
  proxima = Date.now() + CONFIG.intervaloSegundos * 1000;
  rodando = false;
  btn.disabled = false;
  render();
}

const fmtHora = d => d ? d.toLocaleTimeString("pt-BR") : "—";
function fmtDesde(d) {
  if (!d) return "—";
  const seg = Math.round((Date.now() - d) / 1000);
  if (seg < 60) return `${seg}s`;
  const min = Math.floor(seg / 60);
  if (min < 60) return `${min} min`;
  const h = Math.floor(min / 60);
  return h < 24 ? `${h}h ${min % 60}min` : `${Math.floor(h / 24)}d ${h % 24}h`;
}
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function render() {
  const grid = document.getElementById("grid");
  grid.innerHTML = estado.map(s => {
    const r = s.resultado;
    const e = ESTADOS[r.estado];
    const nota = r.erro ? `<div class="note err">${esc(r.erro)}</div>`
               : r.aviso ? `<div class="note">${esc(r.aviso)}</div>` : "";
    const comps = (r.componentes || []).map(c => {
      const ce = ESTADOS[c.estado || classificar(c.status) || "degradado"];
      return `<li><span class="pill ${ce.classe}"><span class="dot"></span>${esc(c.status)}</span> ${esc(c.nome)}</li>`;
    }).join("");
    const rotulo = s.tipo === "statuspage" ? "Componentes" : "Módulos";
    const modulos = comps ? `<div class="mods"><div class="label">${rotulo}</div><ul>${comps}</ul></div>` : "";
    const incid = (r.incidentes || []).map(i => `
      <li class="incidente">
        <span class="pill ${i.cor}"><span class="dot"></span>${esc(i.impacto)}</span>
        <div><strong>${i.link ? `<a href="${esc(i.link)}" target="_blank" rel="noopener">${esc(i.nome)}</a>` : esc(i.nome)}</strong>
        ${i.atualizacao ? `<div class="sub">${esc(i.atualizacao.slice(0, 220))}${i.atualizacao.length > 220 ? "…" : ""}</div>` : ""}</div>
      </li>`).join("");
    const incidentes = incid ? `<div class="mods"><div class="label">Incidentes em andamento</div><ul>${incid}</ul></div>` : "";

    const metricas = s.tipo === "statuspage" ? `
          <div class="metric"><div class="label">Status oficial</div><div class="value small">${esc(r.oficial) || "—"}</div></div>
          <div class="metric"><div class="label">Componentes OK</div><div class="value">${r.total != null ? `${r.okCount}/${r.total}` : "—"}</div></div>
          <div class="metric"><div class="label">Incidentes</div><div class="value">${r.incidentes ? r.incidentes.length : "—"}</div></div>
          <div class="metric"><div class="label">Neste estado há</div><div class="value">${fmtDesde(s.desde)}</div></div>` : `
          <div class="metric"><div class="label">Latência</div><div class="value">${r.latencia != null ? r.latencia + " ms" : "—"}</div></div>
          <div class="metric"><div class="label">HTTP</div><div class="value">${r.codigo ?? "—"}</div></div>
          <div class="metric"><div class="label">Health</div><div class="value">${esc(r.corpo) || "—"}</div></div>
          <div class="metric"><div class="label">Neste estado há</div><div class="value">${fmtDesde(s.desde)}</div></div>`;
    const fonte = s.tipo === "statuspage"
      ? `Fonte: página oficial de status · <a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.url.replace(/^https?:\/\//, ""))}</a>`
      : esc(s.url);

    return `
      <div class="card">
        <div class="card-top">
          <div>
            <div class="name">${esc(s.nome)}</div>
            <div class="url">${fonte}</div>
          </div>
          <span class="pill ${e.classe}"><span class="dot"></span>${e.texto}</span>
        </div>
        <div class="metrics">${metricas}
        </div>
        ${incidentes}
        ${modulos}
        ${nota}
      </div>`;
  }).join("");

  // Banner geral
  const estados = estado.map(s => s.resultado.estado);
  let classe, texto;
  if (estados.includes("checando"))      { classe = "idle"; texto = "Verificando serviços…"; }
  else if (estados.includes("fora"))     { classe = "down"; texto = estado.length > 1 ? "Há serviços fora do ar" : "API fora do ar"; }
  else if (estados.some(x => x === "lento" || x === "degradado")) { classe = "warn"; texto = "Instabilidade detectada"; }
  else if (estados.includes("manutencao")) { classe = "warn"; texto = "Serviço em manutenção programada"; }
  else if (estados.includes("semdados"))   { classe = "warn"; texto = "Nem todos os serviços puderam ser verificados"; }
  else                                   { classe = "ok";   texto = "Todos os sistemas operacionais"; }
  banner.className = `banner ${classe}`;
  bannerText.textContent = texto;

  const icone = { ok: "🟢", warn: "🟡", down: "🔴", idle: "⚪" }[classe];
  document.title = `${icone} ${CONFIG.titulo}`;
}

function tick() {
  const ultima = estado[0]?.resultado.quando;
  const faltam = Math.max(0, Math.ceil((proxima - Date.now()) / 1000));
  sub.textContent = rodando
    ? "Verificando…"
    : `Última verificação: ${fmtHora(ultima)} · próxima em ${faltam}s`;
  if (!rodando && proxima && Date.now() >= proxima) checarTodos();
}

const btn = document.getElementById("btn");
const banner = document.getElementById("banner");
const bannerText = document.getElementById("bannerText");
const sub = document.getElementById("sub");
document.getElementById("footer").textContent =
  `Atualiza automaticamente a cada ${CONFIG.intervaloSegundos}s · timeout ${CONFIG.timeoutMs / 1000}s`;

btn.addEventListener("click", checarTodos);
// Ao voltar para a aba, checa na hora
document.addEventListener("visibilitychange", () => { if (!document.hidden && relogio) checarTodos(); });

/* ============ MONITOR ============ */
let relogio = null;
function iniciarMonitor() {
  if (relogio) return;
  render();
  checarTodos();
  relogio = setInterval(() => { tick(); if (!rodando) render(); }, 1000);
}
function pararMonitor() {
  clearInterval(relogio);
  relogio = null;
}

/* ============ LOGIN ============ */
const gate = document.getElementById("gate");
const app = document.getElementById("app");
const gateErro = document.getElementById("gateErro");
const entrar = document.getElementById("entrar");

function mostrarGate(msg) {
  pararMonitor();
  app.hidden = true;
  gate.hidden = false;
  if (msg !== undefined) gateErro.textContent = msg;
}

function mostrarApp(user) {
  gate.hidden = true;
  app.hidden = false;
  document.getElementById("usuario").textContent = user.email;
  iniciarMonitor();
}

function autorizado(user) {
  const email = (user.email || "").toLowerCase();
  const dominio = email.split("@")[1] || "";
  const dominios = CONFIG.acesso.dominios.map(d => d.toLowerCase());
  const emails = CONFIG.acesso.emails.map(e => e.toLowerCase());
  return user.emailVerified && (emails.includes(email) || dominios.includes(dominio));
}

if (typeof firebase === "undefined" || !firebase.apps?.length) {
  entrar.disabled = true;
  mostrarGate("O login só funciona com a página servida pelo Firebase Hosting (link publicado ou \"firebase serve\"), não abrindo o arquivo direto.");
} else {
  const auth = firebase.auth();
  const provider = new firebase.auth.GoogleAuthProvider();
  const params = { prompt: "select_account" };
  if (CONFIG.acesso.dominios.length === 1) params.hd = CONFIG.acesso.dominios[0]; // sugere a conta da empresa
  provider.setCustomParameters(params);

  entrar.addEventListener("click", () => {
    gateErro.textContent = "";
    auth.signInWithPopup(provider).catch(e => {
      if (e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request") {
        gateErro.textContent = "Não foi possível entrar: " + e.message;
      }
    });
  });

  document.getElementById("sair").addEventListener("click", () => {
    gateErro.textContent = "";
    auth.signOut();
  });

  auth.onAuthStateChanged(async user => {
    if (!user) { mostrarGate(); return; }
    if (!autorizado(user)) {
      const email = user.email;
      await auth.signOut();
      mostrarGate(`A conta ${email} não tem acesso a esta página.`);
      return;
    }
    mostrarApp(user);
  });
}
</script>
